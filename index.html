<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KhanaGo — Fresh Food Delivered</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23E04F26'/%3E%3Cpath d='M22 16v14c0 3.3 2.7 6 6 6v12h4V36c3.3 0 6-2.7 6-6V16h-4v11h-3V16h-4v11h-3V16h-4zm20 0v32h4V16h-4z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <style>
    :root {
      --primary: #E04F26;
      --primary-dark: #B93B17;
      --bg: #F6F5F2;
      --card: #FFFFFF;
      --text: #18181B;
      --muted: #66666E;
      --border: #E6E2DC;
      --soft: #FFF1EC;
      --success-bg: #ECFDF5;
      --success-text: #065F46;
      --success-border: #A7F3D0;
      --danger-bg: #FEF2F2;
      --danger-text: #991B1B;
      --danger-border: #FECACA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
    }

    /* Step 1 Screen */
    #step1Screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .card-box {
      width: 100%;
      max-width: 470px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.1);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.15;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .heading-1 {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .subtext {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .loc-flex {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input, textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 11px;
      border: 1px solid #DCD6CE;
      background: #FCFBF9;
      color: var(--text);
      font-size: 13px;
    }

    input:focus, textarea:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
      background: #fff;
    }

    .btn {
      border: none;
      border-radius: 11px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-sm {
      padding: 9px 12px;
      font-size: 12px;
      border-radius: 10px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .msg-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      display: none;
    }

    .msg-box.err {
      display: block;
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
    }

    .msg-box.ok {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .helper-link-btn {
      margin-top: 6px;
      background: none;
      border: none;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      display: none;
    }

    /* Step 2 Screen */
    #step2Screen {
      display: none;
      padding-bottom: 105px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 25;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .app-header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .top-bar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .mini-logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .loc-pill-btn {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 7px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      text-align: left;
    }

    .loc-title {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loc-addr {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mode-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--muted);
    }

    .switch-pill {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
    }

    .switch-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .switch-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .receiver-row {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .receiver-row.show {
      display: grid;
    }

    .app-body {
      max-width: 960px;
      margin: 16px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      scroll-margin-top: 135px;
    }

    .section-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .section-heading {
      font-size: 16px;
      font-weight: 800;
    }

    .shops-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }

    .shop-box {
      background: #FCFBF9;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 7px;
    }

    .shop-box.active {
      background: var(--soft);
      border-color: var(--primary);
    }

    .menu-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 12px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .food-box {
      background: #FCFBF9;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .food-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .cart-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 13px;
    }

    .qty-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--primary);
      font-weight: 800;
      cursor: pointer;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 800;
      margin: 14px 0;
    }

    .chat-area {
      max-height: 200px;
      overflow-y: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-msg {
      max-width: 84%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
    }

    .bottom-dock-wrap {
      position: fixed;
      bottom: 14px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 0 16px;
      z-index: 40;
      pointer-events: none;
    }

    .bottom-dock {
      pointer-events: auto;
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.18);
    }

    .dock-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 6px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      position: relative;
    }

    .dock-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .dock-badge {
      position: absolute;
      top: 2px;
      right: 13px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      border: 2px solid #fff;
      font-size: 10px;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .dock-btn.active .dock-badge {
      background: #fff;
      color: var(--primary);
      border-color: var(--primary);
    }

    @media (max-width: 600px) {
      .grid-2, .loc-flex, .receiver-row, .shops-list, .menu-list {
        grid-template-columns: 1fr;
      }
      .loc-flex {
        display: grid;
      }
    }
  </style>
</head>
<body>

  <!-- Step 1: Customer Details Screen -->
  <div id="step1Screen">
    <div class="card-box">
      <div class="brand-row">
        <div class="brand-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M5 3v7a3 3 0 0 0 3 3v8h2v-8a3 3 0 0 0 3-3V3h-2v5H9V3H7v5H5V3zm12 0v18h2V3h-2z" fill="#FFFFFF"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">KhanaGo</div>
          <div class="brand-sub">Fast &amp; fresh food delivery</div>
        </div>
      </div>

      <h1 class="heading-1">Customer Delivery Details</h1>
      <p class="subtext">Fill in your details and location to open the app.</p>

      <div class="stack">
        <div>
          <label class="label" for="inpName">Full Name</label>
          <input type="text" id="inpName" placeholder="Enter your name" />
        </div>

        <div>
          <label class="label" for="inpPhone">Phone Number</label>
          <input type="tel" id="inpPhone" placeholder="Enter mobile number" />
        </div>

        <div>
          <label class="label" for="inpAddress">Full Address</label>
          <textarea id="inpAddress" rows="2" placeholder="House / flat no., street, area"></textarea>
        </div>

        <div>
          <label class="label" for="inpLandmark">Landmark</label>
          <input type="text" id="inpLandmark" placeholder="Nearby landmark" />
        </div>

        <div class="grid-2">
          <div>
            <label class="label" for="inpState">State</label>
            <input type="text" id="inpState" placeholder="State" />
          </div>

          <div>
            <label class="label" for="inpPincode">Pincode</label>
            <input type="text" id="inpPincode" inputmode="numeric" maxlength="6" placeholder="Pincode" />
          </div>
        </div>

        <div>
          <label class="label" for="inpLocation">Location</label>
          <div class="loc-flex">
            <input type="text" id="inpLocation" placeholder="Tap Use Location or type location" />
            <button type="button" class="btn btn-outline btn-sm" id="btnUseLoc" onclick="onUseLocationTap()">Use Location</button>
          </div>
          <button type="button" class="helper-link-btn" id="btnFillFromAddress" onclick="fillLocationFromAddress()">
            Use typed address &amp; state as location
          </button>
          <div class="msg-box" id="locStatusBox"></div>
        </div>

        <button type="button" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 4px;" onclick="onContinueTap()">
          Continue to KhanaGo
        </button>
      </div>

      <div class="msg-box" id="step1ErrorBox"></div>
    </div>
  </div>

  <!-- Step 2: Main App Screen -->
  <div id="step2Screen">
    <header class="app-header">
      <div class="app-header-inner">
        <div class="top-bar-row">
          <div class="mini-logo" onclick="switchTab('home')" title="Home">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M5 3v7a3 3 0 0 0 3 3v8h2v-8a3 3 0 0 0 3-3V3h-2v5H9V3H7v5H5V3zm12 0v18h2V3h-2z" fill="#FFFFFF"/>
            </svg>
          </div>

          <button type="button" class="loc-pill-btn" onclick="openStep1()">
            <div style="min-width: 0;">
              <div class="loc-title" id="hdrLocText">📍 Location</div>
              <div class="loc-addr" id="hdrAddrText">Address details</div>
            </div>
            <span style="font-size: 11px; font-weight: 700; color: var(--primary);">Edit</span>
          </button>

          <button type="button" class="btn btn-outline btn-sm" onclick="switchTab('help')">Help</button>
        </div>

        <div class="mode-bar">
          <span>Delivering to: <strong id="hdrRecipient">Self</strong></span>
          <div class="switch-pill">
            <button type="button" class="switch-btn active" id="btnSelf" onclick="setRecipientMode('self')">Self</button>
            <button type="button" class="switch-btn" id="btnReceiver" onclick="setRecipientMode('receiver')">Receiver</button>
          </div>
        </div>

        <div class="receiver-row" id="receiverInputs">
          <input type="text" id="inpRecName" placeholder="Receiver full name" oninput="saveReceiverInfo()" />
          <input type="text" id="inpRecPhone" placeholder="Receiver phone / note" oninput="saveReceiverInfo()" />
        </div>
      </div>
    </header>

    <main class="app-body">
      <!-- Shops & Menu Below -->
      <section class="section-card" id="boxShops">
        <div class="section-top">
          <div>
            <h2 class="section-heading">Shops</h2>
            <p class="brand-sub">Tap any shop to see its menu below.</p>
          </div>
          <button type="button" class="btn btn-outline btn-sm" onclick="selectShop('ALL')">All Menus</button>
        </div>

        <div class="shops-list" id="shopsContainer"></div>

        <div>
          <div class="section-top" style="margin-top: 16px; margin-bottom: 0;">
            <div>
              <h3 class="section-heading" id="menuTitle" style="font-size: 15px;">Menu</h3>
              <p class="brand-sub" id="menuSub">Select a shop above</p>
            </div>
          </div>
          <div class="menu-list" id="menuContainer"></div>
        </div>
      </section>

      <!-- Cart -->
      <section class="section-card" id="boxCart">
        <div class="section-top">
          <h2 class="section-heading">Cart</h2>
          <span class="brand-sub" id="cartCountText">0 items</span>
        </div>

        <div id="cartItemsContainer" class="brand-sub">Your cart is empty.</div>

        <div class="total-row">
          <span>Total Payable</span>
          <span id="cartTotalText">₹0</span>
        </div>

        <button type="button" class="btn btn-primary" style="width: 100%; padding: 12px;" onclick="confirmOrder()">
          Place Order
        </button>

        <div class="msg-box" id="orderStatusBox"></div>
      </section>

      <!-- Help Chat -->
      <section class="section-card" id="boxHelp">
        <div class="section-top">
          <div>
            <h2 class="section-heading">Help</h2>
            <p class="brand-sub">Send a message for support.</p>
          </div>
        </div>

        <div class="chat-area" id="chatContainer"></div>

        <div class="loc-flex">
          <input type="text" id="inpChat" placeholder="Write your message..." onkeydown="if(event.key==='Enter') sendChat()" />
          <button type="button" class="btn btn-primary" onclick="sendChat()">Send</button>
        </div>
      </section>
    </main>

    <!-- Floating Bottom Navigation Bar -->
    <div class="bottom-dock-wrap">
      <nav class="bottom-dock" aria-label="Bottom Navigation">
        <button type="button" class="dock-btn active" id="dock-home" onclick="switchTab('home')">
          <span>🏠</span>
          <span>Home</span>
        </button>
        <button type="button" class="dock-btn" id="dock-shops" onclick="switchTab('shops')">
          <span>🏪</span>
          <span>Shops</span>
        </button>
        <button type="button" class="dock-btn" id="dock-cart" onclick="switchTab('cart')">
          <span class="dock-badge" id="dockCartBadge">0</span>
          <span>🛒</span>
          <span>Cart</span>
        </button>
        <button type="button" class="dock-btn" id="dock-help" onclick="switchTab('help')">
          <span>💬</span>
          <span>Help</span>
        </button>
      </nav>
    </div>
  </div>

  <script>
    const KEYS = {
      USER: "khanago_user_v9",
      MODE: "khanago_mode_v9",
      RECEIVER: "khanago_receiver_v9",
      CHATS: "khanago_chats_v9",
      ORDERS: "khanago_orders_v9",
      MERCHANT_SHOPS: "khanago_merchant_shops"
    };

    const defaultShops = [
      {
        id: "annapurna-kitchen",
        name: "Annapurna Kitchen",
        category: "Home Meals",
        rating: "4.6 ★",
        eta: "25–30 mins",
        items: [
          { id: "ak-1", name: "Classic Home Thali", desc: "4 rotis, dal tadka, seasonal sabzi, rice, and salad.", price: 120 },
          { id: "ak-2", name: "Dal Chawal Combo", desc: "Ghee-tempered dal with steamed basmati rice.", price:
