<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#E04F26" />
  <title>KhanaGo</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23E04F26'/%3E%3Cpath d='M22 16v14c0 3.3 2.7 6 6 6v12h4V36c3.3 0 6-2.7 6-6V16h-4v11h-3V16h-4v11h-3V16h-4zm20 0v32h4V16h-4z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <style>
    :root {
      --primary: #E04F26;
      --primary-dark: #B93B17;
      --bg: #F6F5F2;
      --card: #FFFFFF;
      --text: #18181B;
      --muted: #66666E;
      --border: #E6E2DC;
      --soft: #FFF1EC;
      --ok-bg: #ECFDF5;
      --ok-text: #065F46;
      --err-bg: #FEF2F2;
      --err-text: #991B1B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
    }

    #setupScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 14px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .logo-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .sub {
      font-size: 12px;
      color: var(--muted);
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-top: 12px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .lbl {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .loc-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    input, textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 11px;
      border: 1px solid #DCD6CE;
      background: #FCFBF9;
      color: var(--text);
      font-size: 14px;
    }

    input:focus, textarea:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
      background: #fff;
    }

    .btn {
      border: none;
      border-radius: 11px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:active {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .btn-outline:active {
      background: var(--soft);
    }

    .msg {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      display: none;
    }

    .msg.ok {
      display: block;
      background: var(--ok-bg);
      color: var(--ok-text);
    }

    .msg.err {
      display: block;
      background: var(--err-bg);
      color: var(--err-text);
    }

    #appScreen {
      display: none;
      padding-bottom: 95px;
    }

    .top-hdr {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }

    .top-in {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hdr-flex {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .addr-btn {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      text-align: left;
    }

    .addr-1 {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .addr-2 {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rec-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--muted);
    }

    .pill-wrap {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
    }

    .pill-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .pill-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .rec-inputs {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .rec-inputs.show {
      display: grid;
    }

    .wrap {
      max-width: 960px;
      margin: 14px auto 0;
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sec-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      scroll-margin-top: 130px;
    }

    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .shops-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    .shop-card {
      background: #FCFBF9;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .shop-card.active {
      background: var(--soft);
      border-color: var(--primary);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .dish-card {
      background: #FCFBF9;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .dish-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .cart-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 13px;
    }

    .qty-box {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--primary);
      font-weight: 800;
      cursor: pointer;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 800;
      margin: 14px 0;
    }

    .chat-box {
      max-height: 190px;
      overflow-y: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
    }

    .nav-fixed {
      position: fixed;
      bottom: 14px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 0 14px;
      z-index: 40;
      pointer-events: none;
    }

    .nav-pill {
      pointer-events: auto;
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      box-shadow: 0 12px 26px -8px rgba(0, 0, 0, 0.18);
    }

    .nav-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 6px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      position: relative;
    }

    .nav-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .badge {
      position: absolute;
      top: 2px;
      right: 12px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      border: 2px solid #fff;
      font-size: 10px;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .nav-btn.active .badge {
      background: #fff;
      color: var(--primary);
      border-color: var(--primary);
    }

    @media (max-width: 560px) {
      .two-col, .loc-row, .rec-inputs, .shops-grid, .menu-grid {
        grid-template-columns: 1fr;
      }
      .loc-row {
        display: flex;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div id="setupScreen">
    <div class="card">
      <div class="brand-row">
        <div class="logo-box" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M5 3v7a3 3 0 0 0 3 3v8h2v-8a3 3 0 0 0 3-3V3h-2v5H9V3H7v5H5V3zm12 0v18h2V3h-2z" fill="#FFFFFF"/>
          </svg>
        </div>
        <div>
          <div style="font-size:19px; font-weight:800; line-height:1.15;">KhanaGo</div>
          <div class="sub">Fresh food delivery</div>
        </div>
      </div>

      <h1 class="title">Delivery Details</h1>
      <p class="sub">Enter your details and location to continue.</p>

      <div class="stack">
        <div>
          <label class="lbl" for="inName">Full Name</label>
          <input type="text" id="inName" placeholder="Enter your name" />
        </div>

        <div>
          <label class="lbl" for="inPhone">Phone Number</label>
          <input type="tel" id="inPhone" placeholder="Enter mobile number" />
        </div>

        <div>
          <label class="lbl" for="inAddress">Full Address</label>
          <textarea id="inAddress" rows="2" placeholder="House / flat no., street, area"></textarea>
        </div>

        <div>
          <label class="lbl" for="inLandmark">Landmark</label>
          <input type="text" id="inLandmark" placeholder="Nearby landmark" />
        </div>

        <div class="two-col">
          <div>
            <label class="lbl" for="inState">State</label>
            <input type="text" id="inState" placeholder="State" />
          </div>
          <div>
            <label class="lbl" for="inPincode">Pincode</label>
            <input type="text" id="inPincode" inputmode="numeric" maxlength="6" placeholder="Pincode" />
          </div>
        </div>

        <div>
          <label class="lbl" for="inLocation">Location</label>
          <div class="loc-row">
            <input type="text" id="inLocation" placeholder="Tap Use Location or type location" />
            <button type="button" class="btn btn-outline" id="btnUseLoc">Use Location</button>
          </div>
          <div class="msg" id="locMsg"></div>
        </div>

        <button type="button" class="btn btn-primary" id="btnContinue" style="width:100%; padding:12px;">
          Continue to KhanaGo
        </button>
      </div>

      <div class="msg" id="setupMsg"></div>
    </div>
  </div>

  <div id="appScreen">
    <header class="top-hdr">
      <div class="top-in">
        <div class="hdr-flex">
          <button type="button" class="logo-box" id="btnTopHome" style="width:36px; height:36px; border:none; cursor:pointer;" aria-label="Home">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M5 3v7a3 3 0 0 0 3 3v8h2v-8a3 3 0 0 0 3-3V3h-2v5H9V3H7v5H5V3zm12 0v18h2V3h-2z" fill="#FFFFFF"/>
            </svg>
          </button>

          <button type="button" class="addr-btn" id="btnEditAddr">
            <div style="min-width:0;">
              <div class="addr-1" id="topLoc">Location</div>
              <div class="addr-2" id="topAddr">Address</div>
            </div>
            <span style="font-size:11px; font-weight:700; color:var(--primary);">Edit</span>
          </button>

          <button type="button" class="btn btn-outline" id="btnTopHelp" style="padding:8px 11px; font-size:12px;">Help</button>
        </div>

        <div class="rec-bar">
          <span>Delivering to: <strong id="recSummary">Self</strong></span>
          <div class="pill-wrap">
            <button type="button" class="pill-btn active" id="btnSelf">Self</button>
            <button type="button" class="pill-btn" id="btnRec">Receiver</button>
          </div>
        </div>

        <div class="rec-inputs" id="recInputs">
          <input type="text" id="recName" placeholder="Receiver full name" />
          <input type="text" id="recPhone" placeholder="Receiver phone / note" />
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="sec-card" id="secShops">
        <div class="sec-head">
          <div>
            <h2 class="title" style="margin:0;">Shops</h2>
            <p class="sub">Tap any shop to view its menu below.</p>
          </div>
          <button type="button" class="btn btn-outline" id="btnAllMenus" style="padding:8px 12px; font-size:12px;">All Menus</button>
        </div>

        <div class="shops-grid" id="shopsGrid"></div>

        <div>
          <div class="sec-head" style="margin-top:16px; margin-bottom:0;">
            <div>
              <h3 class="title" id="menuTitle" style="font-size:15px; margin:0;">Menu</h3>
              <p class="sub" id="menuSub">Select a shop above</p>
            </div>
          </div>
          <div class="menu-grid" id="menuGrid"></div>
        </div>
      </section>

      <section class="sec-card" id="secCart">
        <div class="sec-head">
          <h2 class="title" style="margin:0;">Cart</h2>
          <span class="sub" id="cartCount">0 items</span>
        </div>

        <div id="cartItems" class="sub">Your cart is empty.</div>

        <div class="total-row">
          <span>Total Payable</span>
          <span id="cartTotal">₹0</span>
        </div>

        <button type="button" class="btn btn-primary" id="btnPlaceOrder" style="width:100%; padding:12px;">
          Place Order
        </button>

        <div class="msg" id="orderMsg"></div>
      </section>

      <section class="sec-card" id="secHelp">
        <div class="sec-head">
          <div>
            <h2 class="title" style="margin:0;">Help</h2>
            <p class="sub">Send a message for support.</p>
          </div>
        </div>

        <div class="chat-box" id="chatBox"></div>

        <div class="loc-row">
          <input type="text" id="chatInput" placeholder="Write your message..." />
          <button type="button" class="btn btn-primary" id="btnSendChat">Send</button>
        </div>
      </section>
    </main>

    <div class="nav-fixed">
      <nav class="nav-pill" aria-label="Bottom Navigation">
        <button type="button" class="nav-btn active" id="t-home">
          <span>🏠</span>
          <span>Home</span>
        </button>
        <button type="button" class="nav-btn" id="t-shops">
          <span>🏪</span>
          <span>Shops</span>
        </button>
        <button type="button" class="nav-btn" id="t-cart">
          <span class="badge" id="cartBadge">0</span>
          <span>🛒</span>
          <span>Cart</span>
        </button>
        <button type="button" class="nav-btn" id="t-help">
          <span>💬</span>
          <span>Help</span>
        </button>
      </nav>
    </div>
  </div>

  <script>
    (function () {
      const STORE = {
        USER: "khanago_v12_user",
        MODE: "khanago_v12_mode",
        REC: "khanago_v12_rec",
        CHAT: "khanago_v12_chat",
        ORDERS: "khanago_v12_orders",
        SHOPS: "khanago_merchant_shops"
      };

      const baseShops = [
        {
          id: "annapurna-kitchen",
          name: "Annapurna Kitchen",
          category: "Home Meals",
          rating: "4.6 ★",
          eta: "25–30 mins",
          items: [
            { id: "ak-1", name: "Classic Home Thali", desc: "4 rotis, dal tadka, seasonal sabzi, rice, and salad.", price: 120 },
            { id: "ak-2", name: "Dal Chawal Combo", desc: "Ghee-tempered dal with steamed basmati rice.", price: 85 }
          ]
        },
        {
          id: "tandoor-junction",
          name: "Tandoor Junction",
          category: "Rolls & Grills",
          rating: "4.5 ★",
          eta: "20–25 mins",
          items: [
            { id: "tj-1", name: "Paneer Tikka Roll", desc: "Soft paratha with roasted paneer and mint chutney.", price: 95 },
            { id: "tj-2", name: "Soya Chaap Roll", desc: "Spiced chaap roll with onions and green chutney.", price: 100 }
          ]
        },
        {
          id: "chai-crunch",
          name: "Chai & Crunch",
          category: "Tea & Snacks",
          rating: "4.8 ★",
          eta: "15–20 mins",
          items: [
            { id: "cc-1", name: "Masala Chai + Samosa (2 pcs)", desc: "Hot spiced tea with two crispy samosas.", price: 60 },
            { id: "cc-2", name: "Bread Pakora Plate (2 pcs)", desc: "Stuffed potato bread pakoras with chutney.", price: 50 }
          ]
        }
      ];

      function getShops() {
        let extra = [];
        try {
          const raw = JSON.parse(localStorage.getItem(STORE.SHOPS) || "[]");
          if (Array.isArray(raw)) {
            extra = raw.map((s, i) => ({
              id: s.id || `partner-${i}`,
              name: s.name || "Partner Shop",
              category: s.category || "Partner",
              rating: s.rating || "4.5 ★",
              eta: s.eta || "25–30 mins",
              items: Array.isArray(s.items) ? s.items : (Array.isArray(s.menu) ? s.menu : [])
            }));
          }
        } catch (_) {}

        const map = new Map();
        baseShops.forEach(s => map.set(s.id, s));
        extra.forEach(s => map.set(s.id, s));
        return Array.from(map.values());
      }

      let shops = getShops();
      let curShop = shops[0] ? shops[0].id : "ALL";
      let cart = {};
      let user = null;
      try { user = JSON.parse(localStorage.getItem(STORE.USER) || "null"); } catch (_) {}
      let recMode = localStorage.getItem(STORE.MODE) || "self";
      let rec = { name: "", phone: "" };
      try { rec = JSON.parse(localStorage.getItem(STORE.REC) || '{"name
