<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#E04F26" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="KhanaGo" />
  <title>KhanaGo</title>
  <link id="appIconLink" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23E04F26'/%3E%3Cpath d='M22 16v14c0 3.3 2.7 6 6 6v12h4V36c3.3 0 6-2.7 6-6V16h-4v11h-3V16h-4v11h-3V16h-4zm20 0v32h4V16h-4z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link id="appleIconLink" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23E04F26'/%3E%3Cpath d='M22 16v14c0 3.3 2.7 6 6 6v12h4V36c3.3 0 6-2.7 6-6V16h-4v11h-3V16h-4v11h-3V16h-4zm20 0v32h4V16h-4z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link id="manifestLink" rel="manifest" href="" />
  <script>
    (function setupManifest() {
      const iconSvg =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='44' fill='%23E04F26'/%3E%3Cpath d='M66 48v42c0 9.9 8.1 18 18 18v36h12v-36c9.9 0 18-8.1 18-18V48h-12v33h-9V48h-12v33h-9V48H66zm60 0v96h12V48h-12z' fill='%23ffffff'/%3E%3C/svg%3E";
      const manifestObj = {
        name: "KhanaGo",
        short_name: "KhanaGo",
        description: "Fresh Food Delivered",
        start_url: "./",
        scope: "./",
        display: "standalone",
        background_color: "#F6F5F2",
        theme_color: "#E04F26",
        icons: [
          {
            src: iconSvg,
            sizes: "192x192",
            type: "image/svg+xml",
            purpose: "any maskable"
          }
        ]
      };
      const blob = new Blob([JSON.stringify(manifestObj)], { type: "application/manifest+json" });
      const url = URL.createObjectURL(blob);
      const link = document.getElementById("manifestLink");
      if (link) link.href = url;
    })();
  </script>
  <style>
    :root {
      --primary: #E04F26;
      --primary-dark: #B93B17;
      --bg: #F6F5F2;
      --card: #FFFFFF;
      --text: #18181B;
      --muted: #66666E;
      --border: #E6E2DC;
      --soft: #FFF1EC;
      --ok-bg: #ECFDF5;
      --ok-text: #065F46;
      --err-bg: #FEF2F2;
      --err-text: #991B1B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      -webkit-tap-highlight-color: rgba(224, 79, 38, 0.15);
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
    }

    /* Screen 1: Delivery Details */
    #screenSetup {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 14px;
    }

    .card-setup {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 28px -12px rgba(0, 0, 0, 0.1);
    }

    .brand-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .h-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .h-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .fields-col {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-top: 12px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field-lbl {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .loc-group {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    input, textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 11px;
      border: 1px solid #DCD6CE;
      background: #FCFBF9;
      color: var(--text);
      font-size: 14px;
    }

    input:focus, textarea:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
      background: #fff;
    }

    .btn {
      border: none;
      border-radius: 11px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:active {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .btn-outline:active {
      background: var(--soft);
    }

    .msg-banner {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      display: none;
    }

    .msg-banner.ok {
      display: block;
      background: var(--ok-bg);
      color: var(--ok-text);
    }

    .msg-banner.err {
      display: block;
      background: var(--err-bg);
      color: var(--err-text);
    }

    /* Screen 2: Main App */
    #screenApp {
      display: none;
      width: 100%;
      padding-bottom: 100px;
    }

    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }

    .sticky-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bar-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .loc-summary-btn {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      text-align: left;
      touch-action: manipulation;
    }

    .loc-line-1 {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loc-line-2 {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rec-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--muted);
    }

    .seg-box {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
    }

    .seg-opt {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .seg-opt.active {
      background: var(--primary);
      color: #fff;
    }

    .rec-inputs {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .rec-inputs.show {
      display: grid;
    }

    .app-container {
      max-width: 960px;
      margin: 14px auto 0;
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      scroll-margin-top: 130px;
    }

    .panel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .shops-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    .shop-item {
      background: #FCFBF9;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      touch-action: manipulation;
    }

    .shop-item.active {
      background: var(--soft);
      border-color: var(--primary);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .dish-item {
      background: #FCFBF9;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .dish-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .cart-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 13px;
    }

    .qty-ctrl {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--primary);
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    .total-bar {
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 800;
      margin: 14px 0;
    }

    .chat-box {
      max-height: 190px;
      overflow-y: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
    }

    /* Bottom Floating Dock */
    .dock-fixed {
      position: fixed;
      bottom: 14px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 0 14px;
      z-index: 60;
      pointer-events: none;
    }

    .dock-pill {
      pointer-events: auto;
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      box-shadow: 0 12px 26px -8px rgba(0, 0, 0, 0.18);
    }

    .dock-tab {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 6px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      position: relative;
      touch-action: manipulation;
    }

    .dock-tab.active {
      background: var(--primary);
      color: #fff;
    }

    .dock-badge {
      position: absolute;
      top: 2px;
      right: 12px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      border: 2px solid #fff;
      font-size: 10px;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .dock-tab.active .dock-badge {
      background: #fff;
      color: var(--primary);
      border-color: var(--primary);
    }

    @media (max-width: 560px) {
      .row-2, .loc-group, .rec-inputs, .shops-grid, .menu-grid {
        grid-template-columns: 1fr;
      }
      .loc-group {
        display: flex;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <!-- Screen 1: Customer Details -->
  <div id="screenSetup">
    <div class="card-setup">
      <div class="brand-bar">
        <div class="brand-badge" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M5 3v7a3 3 0 0 0 3 3v8h2v-8a3 3 0 0 0 3-3V3h-2v5H9V3H7v5H5V3zm12 0v18h2V3h-2z" fill="#FFFFFF"/>
          </svg>
        </div>
        <div>
          <div style="font-size:20px; font-weight:800; line-height:1.15;">KhanaGo</div>
          <div class="h-sub">Fast &amp; fresh food delivery</div>
        </div>
      </div>

      <h1 class="h-title">Delivery Details</h1>
      <p class="h-sub">Enter your details and location to open the app.</p>

      <div class="fields-col">
        <div>
          <label class="field-lbl" for="inName">Full Name</label>
          <input type="text" id="inName" placeholder="Enter your name" />
        </div>

        <div>
          <label class="field-lbl" for="inPhone">Phone Number</label>
          <input type="tel" id="inPhone" placeholder="Enter mobile number" />
        </div>

        <div>
          <label class="field-lbl" for="inAddress">Full Address</label>
          <textarea id="inAddress" rows="2" placeholder="House / flat no., street, locality"></textarea>
        </div>

        <div>
          <label class="field-lbl" for="inLandmark">Landmark</label>
          <input type="text" id="inLandmark" placeholder="Nearby landmark" />
        </div>

        <div class="row-2">
          <div>
            <label class="field-lbl" for="inState">State</label>
            <input type="text" id="inState" placeholder="State" />
          </div>
          <div>
            <label class="field-lbl" for="inPincode">Pincode</label>
            <input type="text" id="inPincode" inputmode="numeric" maxlength="6" placeholder="Pincode" />
          </div>
        </div>

        <div>
          <label class="field-lbl" for="inLocation">Location</label>
          <div class="loc-group">
            <input type="text" id="inLocation" placeholder="Tap Use Location or type location" />
            <button type="button" class="btn btn-outline" id="btnUseLocation" onclick="askLocation()">Use Location</button>
          </div>
          <div class="msg-banner" id="locBanner"></div>
        </div>

        <button type="button" class="btn btn-primary" style="width:100%; padding:12px;" id="btnContinue" onclick="enterApp()">
          Continue to KhanaGo
        </button>
      </div>

      <div class="msg-banner" id="setupBanner"></div>
    </div>
  </div>

  <!-- Screen 2: Main App -->
  <div id="screenApp">
    <header class="sticky-top">
      <div class="sticky-inner">
        <div class="bar-top">
          <button type="button" class="brand-badge" style="width:36px; height:36px; border-radius:10px; border:none; cursor:pointer;" onclick="openTab('home')" aria-label="Home">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M5 3v7a3 3 0 0 0 3 3v8h2v-8a3 3 0 0 0 3-3V3h-2v5H9V3H7v5H5V3zm12 0v18h2V3h-2z" fill="#FFFFFF"/>
            </svg>
          </button>

          <button type="button" class="loc-summary-btn" onclick="openSetupScreen()">
            <div style="min-width:0;">
              <div class="loc-line-1" id="appLocTitle">📍 Location</div>
              <div class="loc-line-2" id="appAddrSub">Address</div>
            </div>
            <span style="font-size:11px; font-weight:700; color:var(--primary);">Edit</span>
          </button>

          <button type="button" class="btn btn-outline" style="padding:8px 11px; font-size:12px;" onclick="openTab('help')">Help</button>
        </div>

        <div class="rec-strip">
          <span>Delivering to: <strong id="recText">Self</strong></span>
          <div class="seg-box">
            <button type="button" class="seg-opt active" id="optSelf" onclick="chooseRecipient('self')">Self</button>
            <button type="button" class="seg-opt" id="optRec" onclick="chooseRecipient('receiver')">Receiver</button>
          </div>
        </div>

        <div class="rec-inputs" id="recInputs">
          <input type="text" id="recName" placeholder="Receiver full name" oninput="persistReceiver()" />
          <input type="text" id="recPhone" placeholder="Receiver phone / note" oninput="persistReceiver()" />
        </div>
      </div>
    </header>

    <main class="app-container">
      <section class="panel-box" id="sec-shops">
        <div class="panel-top">
          <div>
            <h2 class="h-title" style="margin:0;">Shops</h2>
            <p class="h-sub">Tap any shop to view its menu below.</p>
          </div>
          <button type="button" class="btn btn-outline" style="padding:8px 12px; font-size:12px;" onclick="selectShop('ALL')">All Menus</button>
        </div>

        <div class="shops-grid" id="shopsGrid"></div>

        <div>
          <div class="panel-top" style="margin-top:16px; margin-bottom:0;">
            <div>
              <h3 class="h-title" id="menuTitle" style="font-size:15px; margin:0;">Menu</h3>
              <p class="h-sub" id="menuSub">Select a shop above</p>
            </div>
          </div>
          <div class="menu-grid" id="menuGrid"></div>
        </div>
      </section>

      <section class="panel-box" id="sec-cart">
        <div class="panel-top">
          <h2 class="h-title" style="margin:0;">Cart</h2>
          <span class="h-sub" id="cartCount">0 items</span>
        </div>

        <div id="cartItems" class="h-sub">Your cart is empty.</div>

        <div class="total-bar">
          <span>Total Payable</span>
          <span id="cartTotal">₹0</span>
        </div>

        <button type="button" class="btn btn-primary" style="width:100%; padding:12px;" onclick="placeOrder()">
          Place Order
        </button>

        <div class="msg-banner" id="orderBanner"></div>
      </section>

      <section class="panel-box" id="sec-help">
        <div class="panel-top">
          <div>
            <h2 class="h-title" style="margin:0;">Help</h2>
            <p class="h-sub">Send a message for support.</p>
          </div>
        </div>

        <div class="chat-box" id="chatList"></div>

        <div class="loc-group">
          <input type="text" id="chatInput" placeholder="Write your message..." onkeydown="if(event.key==='Enter') sendChat()" />
          <button type="button" class="btn btn-primary" onclick="sendChat()">Send</button>
        </div>
      </section>
    </main>

    <div class="dock-fixed">
      <nav class="dock-pill" aria-label="Bottom Navigation">
        <button type="button" class="dock-tab active" id="tab-home" onclick="openTab('home')">
          <span>🏠</span>
          <span>Home</span>
        </button>
        <button type="button" class="dock-tab" id="tab-shops" onclick="openTab('shops')">
          <span>🏪</span>
          <span>Shops</span>
        </button>
        <button type="button" class="dock-tab" id="tab-cart" onclick="openTab('cart')">
          <span class="dock-badge" id="cartBadge">0</span>
          <span>🛒</span>
          <span>Cart</span>
