<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KhanaGo — Fresh Food Delivered</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23E04F26'/%3E%3Cpath d='M22 16v14c0 3.3 2.7 6 6 6v12h4V36c3.3 0 6-2.7 6-6V16h-4v11h-3V16h-4v11h-3V16h-4zm20 0v32h4V16h-4z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <style>
    :root {
      --primary: #E04F26;
      --primary-dark: #B93B17;
      --bg: #F6F5F2;
      --card: #FFFFFF;
      --text: #18181B;
      --muted: #66666E;
      --border: #E6E2DC;
      --soft: #FFF1EC;
      --ok-bg: #ECFDF5;
      --ok-text: #065F46;
      --err-bg: #FEF2F2;
      --err-text: #991B1B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
    }

    #setupView {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .box {
      width: 100%;
      max-width: 470px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.1);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .sub {
      font-size: 12px;
      color: var(--muted);
    }

    .form-col {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-top: 12px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .lbl {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .loc-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    input, textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 11px;
      border: 1px solid #DCD6CE;
      background: #FCFBF9;
      color: var(--text);
      font-size: 13px;
    }

    input:focus, textarea:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
      background: #fff;
    }

    .btn {
      border: none;
      border-radius: 11px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-sm {
      padding: 9px 12px;
      font-size: 12px;
      border-radius: 10px;
    }

    .btn-main {
      background: var(--primary);
      color: #fff;
    }

    .btn-main:hover {
      background: var(--primary-dark);
    }

    .btn-line {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .notice {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      display: none;
    }

    .notice.ok {
      display: block;
      background: var(--ok-bg);
      color: var(--ok-text);
    }

    .notice.err {
      display: block;
      background: var(--err-bg);
      color: var(--err-text);
    }

    #appView {
      display: none;
      padding-bottom: 100px;
    }

    .top-hdr {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
    }

    .top-hdr-in {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hdr-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .addr-btn {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 7px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      text-align: left;
    }

    .addr-main {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .addr-sub {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rec-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--muted);
    }

    .pill-group {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
    }

    .pill-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .pill-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .rec-fields {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .rec-fields.open {
      display: grid;
    }

    .main-wrap {
      max-width: 960px;
      margin: 16px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      scroll-margin-top: 130px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .grid-shops {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }

    .shop-card {
      background: #FCFBF9;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .shop-card.active {
      background: var(--soft);
      border-color: var(--primary);
    }

    .grid-menu {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .item-card {
      background: #FCFBF9;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .item-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .cart-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 13px;
    }

    .qty-box {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--primary);
      font-weight: 800;
      cursor: pointer;
    }

    .total-line {
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 800;
      margin: 14px 0;
    }

    .chat-box {
      max-height: 190px;
      overflow-y: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg-bubble {
      max-width: 84%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
    }

    .nav-wrap {
      position: fixed;
      bottom: 14px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 0 16px;
      z-index: 30;
      pointer-events: none;
    }

    .nav-bar {
      pointer-events: auto;
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.18);
    }

    .nav-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 6px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      position: relative;
    }

    .nav-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .badge {
      position: absolute;
      top: 2px;
      right: 13px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      border: 2px solid #fff;
      font-size: 10px;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .nav-btn.active .badge {
      background: #fff;
      color: var(--primary);
      border-color: var(--primary);
    }

    @media (max-width: 600px) {
      .two-col, .loc-bar, .rec-fields, .grid-shops, .grid-menu {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Step 1: Customer Details -->
  <div id="setupView">
    <div class="box">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M5 3v7a3 3 0 0 0 3 3v8h2v-8a3 3 0 0 0 3-3V3h-2v5H9V3H7v5H5V3zm12 0v18h2V3h-2z" fill="#FFFFFF"/>
          </svg>
        </div>
        <div>
          <div style="font-size:20px; font-weight:800; line-height:1.15;">KhanaGo</div>
          <div class="sub">Fast &amp; fresh food delivery</div>
        </div>
      </div>

      <h1 class="title">Delivery Details</h1>
      <p class="sub">Enter your details and location to continue to the app.</p>

      <div class="form-col">
        <div>
          <label class="lbl" for="fName">Full Name</label>
          <input type="text" id="fName" placeholder="Enter your name" />
        </div>

        <div>
          <label class="lbl" for="fPhone">Phone Number</label>
          <input type="tel" id="fPhone" placeholder="Enter mobile number" />
        </div>

        <div>
          <label class="lbl" for="fAddress">Full Address</label>
          <textarea id="fAddress" rows="2" placeholder="House / flat no., street, area"></textarea>
        </div>

        <div>
          <label class="lbl" for="fLandmark">Landmark</label>
          <input type="text" id="fLandmark" placeholder="Nearby landmark" />
        </div>

        <div class="two-col">
          <div>
            <label class="lbl" for="fState">State</label>
            <input type="text" id="fState" placeholder="State" />
          </div>
          <div>
            <label class="lbl" for="fPincode">Pincode</label>
            <input type="text" id="fPincode" inputmode="numeric" maxlength="6" placeholder="Pincode" />
          </div>
        </div>

        <div>
          <label class="lbl" for="fLocation">Location</label>
          <div class="loc-bar">
            <input type="text" id="fLocation" placeholder="Tap Use Location or type location" />
            <button type="button" class="btn btn-line btn-sm" id="btnUseLoc" onclick="getLocNow()">Use Location</button>
          </div>
          <div class="notice" id="locNotice"></div>
        </div>

        <button type="button" class="btn btn-main" style="width:100%; padding:12px;" onclick="goToApp()">
          Continue to KhanaGo
        </button>
      </div>

      <div class="notice" id="setupNotice"></div>
    </div>
  </div>

  <!-- Step 2: Main App -->
  <div id="appView">
    <header class="top-hdr">
      <div class="top-hdr-in">
        <div class="hdr-row">
          <div class="logo" style="width:34px; height:34px; border-radius:10px; cursor:pointer;" onclick="goTab('home')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M5 3v7a3 3 0 0 0 3 3v8h2v-8a3 3 0 0 0 3-3V3h-2v5H9V3H7v5H5V3zm12 0v18h2V3h-2z" fill="#FFFFFF"/>
            </svg>
          </div>

          <button type="button" class="addr-btn" onclick="openSetup()">
            <div style="min-width:0;">
              <div class="addr-main" id="topLoc">📍 Location</div>
              <div class="addr-sub" id="topAddr">Address</div>
            </div>
            <span style="font-size:11px; font-weight:700; color:var(--primary);">Edit</span>
          </button>

          <button type="button" class="btn btn-line btn-sm" onclick="goTab('help')">Help</button>
        </div>

        <div class="rec-bar">
          <span>Delivering to: <strong id="recSummary">Self</strong></span>
          <div class="pill-group">
            <button type="button" class="pill-btn active" id="pSelf" onclick="changeRecMode('self')">Self</button>
            <button type="button" class="pill-btn" id="pRec" onclick="changeRecMode('receiver')">Receiver</button>
          </div>
        </div>

        <div class="rec-fields" id="recBox">
          <input type="text" id="recName" placeholder="Receiver full name" oninput="saveRec()" />
          <input type="text" id="recPhone" placeholder="Receiver phone / note" oninput="saveRec()" />
        </div>
      </div>
    </header>

    <main class="main-wrap">
      <section class="card" id="secShops">
        <div class="card-head">
          <div>
            <h2 class="title" style="margin:0;">Shops</h2>
            <p class="sub">Tap any shop to view its menu below.</p>
          </div>
          <button type="button" class="btn btn-line btn-sm" onclick="pickShop('ALL')">All Menus</button>
        </div>

        <div class="grid-shops" id="shopsGrid"></div>

        <div>
          <div class="card-head" style="margin-top:16px; margin-bottom:0;">
            <div>
              <h3 class="title" id="menuHead" style="font-size:15px; margin:0;">Menu</h3>
              <p class="sub" id="menuSub">Select a shop above</p>
            </div>
          </div>
          <div class="grid-menu" id="menuGrid"></div>
        </div>
      </section>

      <section class="card" id="secCart">
        <div class="card-head">
          <h2 class="title" style="margin:0;">Cart</h2>
          <span class="sub" id="cartCount">0 items</span>
        </div>

        <div id="cartItems" class="sub">Your cart is empty.</div>

        <div class="total-line">
          <span>Total Payable</span>
          <span id="cartTotal">₹0</span>
        </div>

        <button type="button" class="btn btn-main" style="width:100%; padding:12px;" onclick="placeOrderNow()">
          Place Order
        </button>

        <div class="notice" id="orderNotice"></div>
      </section>

      <section class="card" id="secHelp">
        <div class="card-head">
          <div>
            <h2 class="title" style="margin:0;">Help</h2>
            <p class="sub">Send a message for support.</p>
          </div>
        </div>

        <div class="chat-box" id="chatList"></div>

        <div class="loc-bar">
          <input type="text" id="chatInput" placeholder="Write your message..." onkeydown="if(event.key==='Enter') sendChatMsg()" />
          <button type="button" class="btn btn-main" onclick="sendChatMsg()">Send</button>
        </div>
      </section>
    </main>

    <div class="nav-wrap">
      <nav class="nav-bar" aria-label="Bottom Navigation">
        <button type="button" class="nav-btn active" id="n-home" onclick="goTab('home')">
          <span>🏠</span>
          <span>Home</span>
        </button>
        <button type="button" class="nav-btn" id="n-shops" onclick="goTab('shops')">
          <span>🏪</span>
          <span>Shops</span>
        </button>
        <button type="button" class="nav-btn" id="n-cart" onclick="goTab('cart')">
          <span class="badge" id="cartBadge">0</span>
          <span>🛒</span>
          <span>Cart</span>
        </button>
        <button type="button" class="nav-btn" id="n-help" onclick="goTab('help')">
          <span>💬</span>
          <span>Help</span>
        </button>
      </nav>
    </div>
  </div>

  <script>
    const DB = {
      USER: "khanago_user_final_v1",
      MODE: "khanago_mode_final_v1",
      REC: "khanago_rec_final_v1",
      CHAT: "khanago_chat_final_v1",
      ORDERS: "khanago_orders_final_v1",
      MERCHANT: "khanago_merchant_shops"
    };

    const baseList = [
      {
        id: "annapurna-kitchen",
        name: "Annapurna Kitchen",
        category: "Home Meals",
        rating: "4.6 ★",
        eta: "25–30 mins",
        items: [
          { id: "ak-1", name: "Classic Home Thali", desc: "4 rotis, dal tadka, seasonal sabzi, rice, and salad.", price: 120 },
          { id: "ak-2", name: "Dal Chawal Combo", desc: "Ghee-tempered dal with steamed basmati rice.", price: 85 }
        ]
      },
      {
        id: "tandoor-junction",
        name: "Tandoor Junction",
        category: "Rolls & Grills",
        rating: "4.5 ★",
        eta: "20–25 mins",
        items: [
          { id: "tj-1", name: "Paneer Tikka Roll", desc: "Soft paratha with roasted paneer and mint chutney.", price: 95 },
          { id: "tj-2", name: "Soya Chaap Roll", desc: "Spiced chaap roll with onions and green chutney.", price: 100 }
        ]
      },
      {
        id: "chai-crunch",
        name: "Chai & Crunch",
        category: "Tea & Snacks",
        rating: "4.8 ★",
        eta: "15–20 mins",
        items: [
          { id: "cc-1", name: "Masala Chai + Samosa (2 pcs)", desc: "Hot spiced tea with two crispy samosas.", price: 60 },
          { id: "cc-2", name: "Bread Pakora Plate (2 pcs)", desc: "Stuffed potato bread pakoras with chutney.", price: 50 }
        ]
      }
    ];

    function loadShops() {
      let extra = [];
      try {
        const raw = JSON.parse(localStorage.getItem(DB.MERCHANT) || "[]");
        if (Array.isArray(raw)) {
          extra = raw.map((s, idx) => ({
            id: s.id || `shop-${idx}`,
            name: s.name || "Partner Shop",
            category: s.category || "Partner",
            rating: s.rating || "4.5 ★",
            eta: s.eta || "25–30 mins",
            items: Array.isArray(s.items) ? s.items : (Array.isArray(s.menu) ? s.menu : [])
          }));
        }
      } catch (_) {}

      const map = new Map();
      baseList.forEach(s => map.set(s.id, s));
      extra.forEach(s => map.set(s.id, s));
      return Array.from(map.values());
    }

    let shops = loadShops();
    let curShop = shops[0] ? shops[0].id : "ALL";
    let cart = {};
    let user = JSON.parse(localStorage.getItem(DB.USER) || "null");
    let recMode = localStorage.getItem(DB.MODE) || "self";
    le
